version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: freebucks
      POSTGRES_PASSWORD: password
      POSTGRES_DB: freebucks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://freebucks:password@postgres:5432/freebucks?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretproductionkey
      - FRONTEND_URL=https://freebucks.example.com
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.freebucks.example.com
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
